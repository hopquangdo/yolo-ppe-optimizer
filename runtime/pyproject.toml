[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe-runtime"
version = "0.1.0"
description = "PPE inference runtime: detect → track → PPE compliance rules."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "ultralytics",  # in-repo fork: pip install -e .. (repo root) before this package
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ppe-runtime = "ppe_runtime.__main__:main"
ppe-bench = "ppe_runtime.bench:main"

[tool.setuptools.packages.find]
include = ["ppe_runtime*"]

[tool.setuptools.package-data]
ppe_runtime = ["tracking/cfg/*.yaml", "ppe/cfg/*.yaml"]
