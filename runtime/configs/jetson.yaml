# Jetson defaults: TensorRT engine, ByteTrack (cheapest), stream paced to 15 FPS.
engine: tensorrt
weights: /models/yolo26n.engine # MODEL_PATH from the Edge Agent overrides this

tracking: bytetrack

ppe:
  rules: rules
  classes: classes

source: "0"
target_fps: 15
report_interval_sec: 5

sinks:
  - type: stdout

log_level: INFO
